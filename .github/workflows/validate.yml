name: validate

# The dataset and mappings are the product here, so they get the same
# treatment code would. The scheduled run matters more than the push run:
# mappings rot on the calendar, not on commits — three clubs are promoted
# every August and their players are absent from last season's golden record
# until someone refreshes it.
on:
  push:
    paths: ["data/**", "solver/**", "validate.py", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "solver/**", "validate.py"]
  schedule:
    - cron: "0 6 * * 1"      # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas pytest highspy

      # Fails if a promoted club or a new signing has no mapping, if the
      # dataset has duplicate keys, or if a completed season stops short.
      - run: python validate.py

      # The solver ships publicly, so it is held to the same bar: the MILP is
      # exercised against fixed cases with known-good solutions.
      - run: python -m pytest solver/tests -q
