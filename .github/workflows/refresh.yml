name: refresh mappings

# Mappings rot on the calendar rather than on commits: three clubs are promoted
# every August and their squads are absent from the previous season's golden
# record until someone refreshes it, and every transfer window adds signings.
#
# Only the mappings are refreshed here. They are small CSVs tracked normally in
# git. The training dataset lives on Hugging Face precisely so that automated
# refreshes do not add a 92 MB copy to this repository every run.
on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mappings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas requests understatapi

      # Understat publishes a season only once it kicks off, so pre-season runs
      # fall back to the ChrisMusson ID map and mark new rows MEDIUM. Expected,
      # not a failure.
      - name: Refresh FPL <-> Understat mappings
        working-directory: data/mappings
        run: python update_golden_records.py

      # Never commit mappings that fail their own checks. A broken automated
      # push is worse than a stale file, because it still looks maintained.
      - name: Validate
        run: python validate.py --quick

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/mappings/; then
            echo "No changes."
            exit 0
          fi
          git add data/mappings/
          git commit -m "Automated refresh: FPL <-> Understat golden records

          Ran by .github/workflows/refresh.yml, validated before committing."
          git push
